<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@500;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#fff; --fg:#111; --accent:#2563EB; --pad:96px; }
    body{ margin:0; background:#eee; display:grid; place-items:center; height:100vh; }
    .poster{
      width:1080px; height:1080px; background:var(--bg); color:var(--fg);
      font-family:"Montserrat Alternates", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      position:relative; padding:var(--pad); box-sizing:border-box;
    }
    .h1{ font-weight:800; font-size:140px; line-height:0.95; letter-spacing:-0.02em; margin:0; }
    .gap{ height:26px; }
    .micro{
      position:absolute; left:var(--pad); bottom:var(--pad);
      font-weight:600; font-size:34px; line-height:1.25; letter-spacing:0.01em; margin:0;
    }
    .accent{ color:var(--accent); }
  </style>
</head>
<body>
  <div class="poster">
    <p class="h1">IF AI CAN CODE,</p>
    <div class="gap"></div>
    <p class="h1">YOU <span class="accent">TAME.</span></p>
    <div class="gap"></div>
    <p class="h1">YOU <span class="accent">SHIP.</span></p>
    <p class="micro">Buildathon Era</p>
  </div>
</body>
</html>
